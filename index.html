else if(state.screen===7)screen(`<h1 class="result-splash">${c.betaResult}</h1><p class="result-note">${c.betaNote}</p><button class="choice primary next" data-act="alphaIntro">${c.alphaNext}</button>`);
else if(state.screen===8)screen(`<p class="eyebrow">05 — ALPHA</p><h1 class="question">${q.alphaIntro.q}</h1><p class="sub">${q.alphaIntro.s}</p><button class="choice primary next" data-act="alphaStart">${q.alphaIntro.a}</button>`);
else if(state.screen===9){const z=q.alphaQs[state.alphaQ];screen(`<p class="eyebrow">${q.question} — ${state.alphaQ+1}/${q.alphaQs.length}</p><h1 class="question">${z[0]}</h1><p class="sub">${q.score}: ${state.alphaScore}/${q.alphaQs.length}</p>${choices(shuffleOptions(z[1],state.alphaQ+10).map(o=>({a:"score"+o[1],l:o[0],correct:o[1]===1})))}`)}
else if(state.screen===10){const pass=state.alphaScore===q.alphaQs.length;screen(`<p class="eyebrow">${q.score}: ${state.alphaScore}/${q.alphaQs.length}</p><h1 class="result-splash">${pass?q.pass.q:q.fail.q}</h1><p class="result-note">${pass?q.pass.s:q.fail.s}</p>${pass?choices(q.pass.a.map((l,i)=>({a:"alpha"+[0,5,10][i],l,c:i===1?"primary":""}))):`<button class="choice primary" data-act="alphaFail">${q.fail.a}</button>`}`)}
else renderFinal()}
function alloc(){if(state.allCash)return[100,0,0];let cash=state.runway===3?40:state.runway===6?30:20;let alpha=Math.min(10,Math.max(0,state.alpha));const d=state.adjust;cash=Math.max(10,Math.min(70,cash-d));alpha=Math.min(10,Math.max(0,alpha+d*.1));let beta=100-cash-alpha;return[cash,beta,alpha]}
function renderFinal(){const c=t(),q=quant[state.lang],g=glossary[state.lang],a=alloc();screen(`<p class="eyebrow">06 — THE MIX</p><h1 class="question">${c.finalQ}</h1><p class="sub">${c.finalS} <strong>${q.cap}</strong></p><div class="allocation"><div class="bucket cash" style="flex:${Math.max(a[0],1)}"><b>${Math.round(a[0])}%</b><span>${c.cash}</span></div><div class="bucket beta" style="flex:${Math.max(a[1],1)}"><b>${Math.round(a[1])}%</b><span>${c.beta}</span></div><div class="bucket alpha" style="flex:${Math.max(a[2],1)}"><b>${Math.round(a[2])}%</b><span>${c.alpha}</span></div></div><div class="slider-wrap"><input class="range" id="mixRange" type="range" min="-15" max="20" value="${state.adjust}" aria-label="Adjust portfolio risk"><div class="range-labels"><span>← ${c.safe}</span><span>${c.wild} →</span></div></div><div class="preset-row"><button class="preset" data-special="cash">${q.allCash}</button><button class="preset" data-special="beta">${q.cashBeta}</button>${c.presets.map((p,i)=>`<button class="preset" data-preset="${i}">${p}</button>`).join("")}</div><button class="restart" data-act="restart">${c.again}</button><p class="disclaimer">${base().footer}</p><details class="glossary"><summary>${g.title}</summary><p class="glossary-intro">${g.intro}</p><dl class="term-grid">${g.terms.map(x=>`<div class="term"><dt>${x[0]}</dt><dd>${x[1]}</dd></div>`).join("")}</dl></details>`)}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;for(let i=0;i<45;i++){const e=document.createElement("i");e.className="confetti";e.style.left=Math.random()*100+"vw";e.style.background=["#ffd92f","#246bfd","#fa3152","#fff"][i%4];e.style.setProperty("--x",(Math.random()*240-120)+"px");e.style.animationDelay=Math.random()*.5+"s";document.body.append(e);setTimeout(()=>e.remove(),2400)}}
document.addEventListener("click",e=>{const a=e.target.closest("[data-act]")?.dataset.act;if(a){if(a==="previous"){const prior=navHistory.pop();if(prior)state=prior;render();return}if(a==="home"){navHistory=[];state={...state,screen:0,adjust:0,alpha:0,betaKnown:null,betaQ:0,betaScore:0,alphaQ:0,alphaScore:0,allCash:false,seed:Math.floor(Math.random()*100000)};render();return}if(a!=="restart")navHistory.push(snapshot());if(a==="no")state.screen=1;if(a==="yes")state.screen=2;if(a.startsWith("runway")){state.runway=+a.replace("runway","");state.screen=3}if(a.startsWith("betaKnow")){state.betaScore+=+a.replace("betaKnow","");state.betaQ++;if(state.betaQ>=quant[state.lang].betaQs.length){state.betaKnown=state.betaScore===quant[state.lang].betaQs.length;state.screen=state.betaKnown?6:5}}if(a==="allcash"){state.allCash=true;state.alpha=0;state.screen=11;confetti()}if(a==="cashbeta"){state.allCash=false;state.alpha=0;state.screen=11}if(a.startsWith("risk")){state.risk=+a.replace("risk","");state.screen=7}if(a==="alphaIntro")state.screen=8;if(a==="alphaStart"){state.alphaQ=0;state.alphaScore=0;state.screen=9}if(a.startsWith("score")){state.alphaScore+=+a.replace("score","");state.alphaQ++;if(state.alphaQ>=quant[state.lang].alphaQs.length)state.screen=10}if(a==="alphaFail"){state.alpha=0;state.screen=11}if(/^alpha(0|5|10)$/.test(a)){state.alpha=+a.replace("alpha","");state.screen=11;confetti()}if(a==="next")state.screen++;if(a==="restart"){navHistory=[];state={...state,screen:0,adjust:0,alpha:0,betaKnown:null,betaQ:0,betaScore:0,alphaQ:0,alphaScore:0,allCash:false,seed:Math.floor(Math.random()*100000)}}render()}const p=e.target.closest("[data-preset]");if(p){state.allCash=false;state.adjust=[-12,0,17][+p.dataset.preset];renderFinal();confetti()}const s=e.target.closest("[data-special]");if(s){state.allCash=s.dataset.special==="cash";state.alpha=0;state.adjust=0;renderFinal();confetti()}})
document.addEventListener("input",e=>{if(e.target.id==="mixRange"){state.adjust=+e.target.value;renderFinal()}})
document.querySelector("#langBtn").onclick=()=>{state.lang=state.lang==="en"?"th":"en";render()};
document.querySelector("#modeBtn").onclick=()=>{state.mode=state.mode==="cute"?"brutal":"cute";document.querySelector(".app").classList.add("shake");setTimeout(()=>document.querySelector(".app")?.classList.remove("shake"),400);render()};
function toggleAnswerLens(){document.body.classList.toggle("answer-lens");confetti()}
let secretKeys="",secretAt=0,holdTimer;
document.addEventListener("keydown",e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const now=Date.now();if(now-secretAt>1400)secretKeys="";secretAt=now;secretKeys=(secretKeys+e.key.toLowerCase()).slice(-3);if(secretKeys==="iii"){toggleAnswerLens();secretKeys=""}});
const brand=document.querySelector(".brand");
brand.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")return;clearTimeout(holdTimer);holdTimer=setTimeout(toggleAnswerLens,5000)});
["pointerup","pointercancel","pointerleave"].forEach(type=>brand.addEventListener(type,()=>clearTimeout(holdTimer)));
render();
</script>
</body>
